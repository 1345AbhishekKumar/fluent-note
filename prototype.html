<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fluent Notes — Windows 11 UI Prototype</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5.2.5/index.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'Inter Variable','Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;
  overflow:hidden;background:#0a0d13;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{border:3px solid transparent;border-radius:8px;background-clip:content-box;background:rgba(128,140,160,.55)}
::-webkit-scrollbar-thumb:hover{background:rgba(128,140,160,.8);border:3px solid transparent;background-clip:content-box}
*{scrollbar-width:thin;scrollbar-color:rgba(128,140,160,.5) transparent}

/* wallpaper layer feeding the Mica tint */
.wall{position:fixed;inset:0;background-size:cover;background-position:center;transition:opacity .5s ease;z-index:0}
.wall-l{background-image:radial-gradient(120% 90% at 70% 10%,#dfe9ff 0%,#b9c8f2 60%,#9fb0e0 100%),url('https://image.qwenlm.ai/public_source/f8b303a9-77ab-485f-93d5-3fdeb580f468/1a8b9c754-8b83-494e-807f-fc2a1514f2a7.png');background-blend-mode:soft-light}
.wall-d{background-image:radial-gradient(120% 90% at 70% 10%,#0d1526 0%,#0a0f1d 60%,#070b16 100%),url('https://image.qwenlm.ai/public_source/f8b303a9-77ab-485f-93d5-3fdeb580f468/12a7d9686-b91d-4041-bb90-1e6420c17317.png');background-blend-mode:soft-light;opacity:0}
body[data-wall="dark"] .wall-d{opacity:1}
body[data-wall="dark"] .wall-l{opacity:0}

/* ============ FULL-BLEED FRAME ============ */
#frame{position:relative;z-index:1;height:100%;display:flex}
.half{flex:1;min-width:0;display:flex}
.divider{flex:none;width:1px;background:rgba(127,127,127,.4);display:none}
body.split .divider{display:block}
body:not(.split) .half.b{display:none}

/* ============ APP — MICA SURFACE ============ */
.win{
  position:relative;flex:1;display:flex;flex-direction:column;overflow:hidden;
  background:var(--mica);
  backdrop-filter:blur(32px) saturate(1.25);
  --tbh:44px;
}
.win[data-theme="light"]{
  --mica:rgba(243,243,243,.82); --mica-solid:#f3f3f3;
  --pane:rgba(251,251,251,.55); --pane-ed:rgba(252,252,252,.78); --pane-brd:rgba(0,0,0,.06);
  --card:#ffffff; --card-h:#f4f6f8; --card-sel:#eef5fc; --card-brd:rgba(0,0,0,.0578);
  --text1:#1a1a1a; --text2:rgba(26,26,26,.72); --text3:rgba(26,26,26,.45);
  --accent:#0067c0; --accent-fill:#0067c0; --accent-fill-h:#1a75c7; --accent-on:#ffffff;
  --accent-soft:rgba(0,103,192,.10); --accent-brd:rgba(0,103,192,.45);
  --divider:rgba(0,0,0,.08); --rv-hi:rgba(0,0,0,.055); --nav-h:rgba(0,0,0,.045);
  --acr:rgba(249,249,249,.82); --acr-brd:rgba(0,0,0,.10); --acr-noise:.035;
  --input:rgba(255,255,255,.7); --sb-thumb:rgba(90,100,115,.5);
  --danger:#c42b1c; --focus:#0067c0;
  --sh-card:0 1px 2px rgba(0,0,0,.06);
}
.win[data-theme="dark"]{
  --mica:rgba(32,32,32,.80); --mica-solid:#202020;
  --pane:rgba(255,255,255,.045); --pane-ed:rgba(255,255,255,.065); --pane-brd:rgba(255,255,255,.075);
  --card:#2d2d2d; --card-h:#333333; --card-sel:#31393f; --card-brd:rgba(255,255,255,.0693);
  --text1:#ffffff; --text2:rgba(255,255,255,.75); --text3:rgba(255,255,255,.45);
  --accent:#60cdff; --accent-fill:#4cc2ff; --accent-fill-h:#62c9f2; --accent-on:#06262e;
  --accent-soft:rgba(96,205,255,.13); --accent-brd:rgba(96,205,255,.5);
  --divider:rgba(255,255,255,.09); --rv-hi:rgba(255,255,255,.07); --nav-h:rgba(255,255,255,.06);
  --acr:rgba(44,44,44,.80); --acr-brd:rgba(255,255,255,.11); --acr-noise:.05;
  --input:rgba(0,0,0,.28); --sb-thumb:rgba(160,170,185,.45);
  --danger:#ff99a4; --focus:#60cdff;
  --sh-card:0 1px 2px rgba(0,0,0,.3);
}

/* reveal hover */
.rv{position:relative}
.rv::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .18s;
  background:radial-gradient(110px circle at var(--mx,50%) var(--my,50%),var(--rv-hi),transparent 72%)}
.rv:hover::before{opacity:1}

.ic svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}
.ic svg .f{fill:currentColor;stroke:none}

/* ============ TITLE BAR ============ */
.titlebar{flex:none;height:var(--tbh);display:flex;align-items:center;gap:6px;padding:0 10px;user-select:none}
.tbtn{width:36px;height:32px;border-radius:6px;display:grid;place-items:center;color:var(--text2);transition:background .13s,transform .1s}
.tbtn:hover{background:var(--nav-h);color:var(--text1)}
.tbtn:active{transform:scale(.92)}
.tbtn.on{background:var(--accent-soft);color:var(--accent)}
.app-ico{width:20px;height:20px;border-radius:5px;background:linear-gradient(135deg,#60cdff,#0067c0);display:grid;place-items:center;flex:none}
.app-ico svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.app-name{font-size:12.5px;font-weight:600;color:var(--text2);letter-spacing:-.01em;flex:none}
.tb-search{flex:1;display:flex;justify-content:center;min-width:0;padding:0 8px}
.sbox{position:relative;width:min(360px,100%)}
.s-ic{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
.s-ic svg{width:15px;height:15px}
.search{width:100%;height:31px;border-radius:7px;border:1px solid var(--card-brd);border-bottom:2px solid var(--card-brd);background:var(--input);padding:0 62px 0 31px;color:var(--text1);outline:none;transition:border-color .15s,background .15s;font-size:12.5px}
.search::placeholder{color:var(--text3)}
.search:focus{border-color:var(--accent);border-bottom-color:var(--accent);background:var(--card)}
.s-kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10px;font-family:ui-monospace,Consolas,monospace;color:var(--text3);background:var(--nav-h);border:1px solid var(--divider);border-radius:4px;padding:2px 5px;pointer-events:none}
.tb-spacer{flex:none;width:4px}

/* ============ PANES ============ */
.app-body{flex:1;display:flex;gap:8px;padding:0 8px 8px;min-height:0;position:relative}
.pane{border-radius:10px;border:1px solid var(--pane-brd);background:var(--pane);overflow:hidden;min-height:0;display:flex;flex-direction:column}
.sidebar{width:262px;flex:none;transition:width .3s cubic-bezier(.15,.85,.25,1),transform .3s cubic-bezier(.15,.85,.25,1)}
.listpane{width:318px;flex:none;transition:width .3s cubic-bezier(.15,.85,.25,1),transform .28s cubic-bezier(.15,.85,.25,1),opacity .28s}
.editorpane{flex:1;min-width:0;background:var(--pane-ed)}
.scrim{position:absolute;inset:0 8px 8px;border-radius:10px;background:rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .28s;z-index:24}

/* sidebar */
.sb-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 8px 8px}
.sb-new{display:flex;align-items:center;gap:9px;width:100%;height:34px;padding:0 13px;border-radius:7px;background:var(--accent-fill);color:var(--accent-on);font-size:12.5px;font-weight:600;margin-bottom:12px;transition:background .15s,transform .1s;box-shadow:var(--sh-card)}
.sb-new:hover{background:var(--accent-fill-h)}
.sb-new:active{transform:scale(.97)}
.sb-new .ic svg{width:15px;height:15px;stroke-width:2}
.sb-label{font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--text3);padding:10px 10px 5px}
.sb-nav{display:flex;flex-direction:column;gap:2px}
.nav-item{position:relative;display:flex;align-items:center;gap:12px;width:100%;height:35px;padding:0 10px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--text2);transition:background .13s}
.nav-item:hover{background:var(--nav-h);color:var(--text1)}
.nav-item:active{transform:scale(.985)}
.nav-item.sel{background:var(--nav-h);color:var(--text1);font-weight:600}
.ni-bar{position:absolute;left:1px;top:50%;transform:translateY(-50%);width:3px;height:0;border-radius:3px;background:var(--accent);transition:height .25s cubic-bezier(.2,.9,.25,1)}
.nav-item.sel .ni-bar{height:15px}
.cnt{margin-left:auto;font-size:10.5px;color:var(--text3);font-weight:500}
.sb-tags{display:flex;flex-wrap:wrap;gap:6px;padding:2px 8px 8px}
.tagchip{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:500;color:var(--text2);background:var(--nav-h);border:1px solid transparent;transition:all .15s}
.tagchip:hover{background:var(--card-h);color:var(--text1)}
.tagchip.on{background:color-mix(in srgb,var(--tc) 16%,transparent);border-color:color-mix(in srgb,var(--tc) 45%,transparent);color:var(--text1)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.sb-foot{flex:none;border-top:1px solid var(--divider);padding:6px 8px}

/* note list */
.lp-head{flex:none;padding:12px 12px 8px;border-bottom:1px solid var(--divider)}
.lp-tr{display:flex;align-items:center;justify-content:space-between;gap:6px}
.lp-title{font-size:15px;font-weight:700;letter-spacing:-.015em;color:var(--text1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lp-actions{display:flex;gap:2px}
.ib{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--text2);transition:background .13s,transform .08s;flex:none}
.ib:hover{background:var(--nav-h);color:var(--text1)}
.ib:active{transform:scale(.9)}
.ib.on{background:var(--accent-soft);color:var(--accent)}
.ib .ic svg{width:16px;height:16px}
.new-note{background:var(--accent-fill);color:var(--accent-on)}
.new-note:hover{background:var(--accent-fill-h);color:var(--accent-on)}
.lp-sub{font-size:11px;color:var(--text3);margin-top:3px}
.lp-scroll{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px}
.note-card{text-align:left;width:100%;border-radius:8px;background:var(--card);border:1px solid var(--card-brd);padding:10px 12px;transition:background .14s,border-color .14s,transform .1s;box-shadow:var(--sh-card);flex:none}
.note-card:hover{background:var(--card-h)}
.note-card:active{transform:scale(.985)}
.note-card.sel{background:var(--card-sel);border-color:var(--accent-brd)}
.nc-top{display:flex;align-items:center;gap:6px}
.nc-title{font-size:13px;font-weight:600;color:var(--text1);letter-spacing:-.01em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc-pin{color:var(--accent)}
.nc-pin svg{width:13px;height:13px}
.nc-snip{font-size:11.5px;line-height:1.45;color:var(--text2);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nc-meta{display:flex;align-items:center;gap:8px;margin-top:7px;font-size:10.5px;color:var(--text3)}
.nc-nb,.nc-tag{display:flex;align-items:center;gap:5px}
.nc-tag .dot{width:6px;height:6px}
.lp-empty{padding:28px 12px;text-align:center;color:var(--text3);font-size:12px}
.lp-empty button{margin-top:10px;padding:5px 12px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:12px}

/* editor */
.ed-bar{flex:none;display:flex;align-items:center;gap:4px;padding:7px 10px;border-bottom:1px solid var(--divider)}
.ed-back{display:none}
.ed-tools{display:flex;align-items:center;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
.ed-tools::-webkit-scrollbar{display:none}
.sep{width:1px;height:18px;background:var(--divider);margin:0 5px;flex:none}
.tb-chr{font-size:12.5px}
.chr{font-family:Georgia,'Times New Roman',serif}
.chr.b{font-weight:800;font-family:inherit}
.chr.i{font-style:italic}
.chr.u{text-decoration:underline}
.chr.s{text-decoration:line-through}
.ib.toggled{background:var(--accent-soft);color:var(--accent)}
.style-btn{width:auto;padding:0 8px;gap:6px;display:flex;align-items:center;font-size:12px;font-weight:500}
.style-btn .ic svg{width:13px;height:13px}
.pin-btn.on{color:var(--accent);background:var(--accent-soft)}
.ed-scroll{flex:1;overflow-y:auto;min-height:0}
.ed-inner{max-width:760px;margin:0 auto;padding:26px 34px 60px;transition:opacity .18s,transform .18s}
.ed-inner.swap{opacity:0;transform:translateY(6px)}
.ed-title{font-size:27px;font-weight:700;letter-spacing:-.022em;line-height:1.15;color:var(--text1);outline:none;min-height:1.2em;word-break:break-word}
.ed-title:empty::before{content:"Untitled";color:var(--text3)}
.ed-meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:12px 0 20px;padding-bottom:16px;border-bottom:1px solid var(--divider)}
.pill{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:500;color:var(--text2);background:var(--nav-h);transition:background .13s}
.pill:hover{background:var(--card-h);color:var(--text1)}
.pill .ic svg{width:12px;height:12px}
.meta-date{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text3)}
.meta-date .ic svg{width:13px;height:13px}
.ed-body{font-size:14.5px;line-height:1.65;color:var(--text1);outline:none;min-height:60px;caret-color:var(--accent)}
.ed-body:empty::before{content:attr(data-ph);color:var(--text3)}
.ed-body p{margin:0 0 10px}
.ed-body h2{font-size:19px;font-weight:700;letter-spacing:-.015em;margin:20px 0 8px}
.ed-body h3{font-size:15.5px;font-weight:600;margin:16px 0 6px}
.ed-body ul,.ed-body ol{margin:0 0 10px;padding-left:24px}
.ed-body li{margin:3px 0}
.ed-body blockquote{margin:14px 0;padding:10px 16px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;font-style:italic;color:var(--text2)}
.ed-body a{color:var(--accent)}
.ed-body ::selection,.search::selection{background:var(--accent-soft)}
.ed-empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:70px 20px;color:var(--text3);font-size:13px}
.ed-empty .ic svg{width:34px;height:34px;stroke-width:1.2;opacity:.5}
.ed-status{flex:none;display:flex;align-items:center;justify-content:space-between;height:30px;padding:0 14px;border-top:1px solid var(--divider);font-size:11px;color:var(--text3)}
.save{display:flex;align-items:center;gap:5px;transition:color .2s}
.save .ic svg{width:12px;height:12px}
.save.busy{color:var(--text3)}
.save.ok{color:var(--accent)}

/* ============ RESPONSIVE (container-driven) ============ */
.win.l .sidebar{width:62px}
.win.l .listpane{width:298px}
.win.sb-user .sidebar{width:62px}
.win.l .sb-txt,.win.sb-user .sb-txt,.win.l .sb-label,.win.sb-user .sb-label,.win.l .sb-tags,.win.sb-user .sb-tags{display:none}
.win.l .sb-new,.win.sb-user .sb-new{width:38px;height:38px;padding:0;margin:0 auto 10px;justify-content:center}
.win.l .nav-item,.win.sb-user .nav-item{justify-content:center;padding:0;gap:0}
.win.l .sb-scroll,.win.sb-user .sb-scroll{padding:10px 10px 8px}
.win.m .listpane{width:268px}
.win.m .sidebar,.win.s .sidebar{position:absolute;left:8px;top:0;bottom:8px;width:262px;z-index:30;transform:translateX(calc(-100% - 14px));box-shadow:0 16px 50px rgba(0,0,0,.35);background:var(--mica-solid)}
.win.m.sb-open .sidebar,.win.s.sb-open .sidebar{transform:none}
.win.m.sb-open .scrim,.win.s.sb-open .scrim{opacity:1;pointer-events:auto}
.win.m .sidebar .sb-txt,.win.s .sidebar .sb-txt,.win.m .sidebar .sb-label,.win.s .sidebar .sb-label,.win.m .sidebar .sb-tags,.win.s .sidebar .sb-tags{display:revert}
.win.m .sidebar .sb-new,.win.s .sidebar .sb-new{width:100%;height:34px;padding:0 13px;margin:0 0 12px;justify-content:flex-start}
.win.m .sidebar .nav-item,.win.s .sidebar .nav-item{justify-content:flex-start;padding:0 10px;gap:12px}
.win.s .listpane{width:auto;flex:1}
.win.s .editorpane{position:absolute;inset:0 8px 8px;z-index:20;transform:translateX(30px);opacity:0;pointer-events:none;transition:transform .3s cubic-bezier(.15,.85,.25,1),opacity .3s}
.win.s.show-editor .editorpane{transform:none;opacity:1;pointer-events:auto}
.win.s.show-editor .listpane{opacity:0;transform:translateX(-26px);pointer-events:none}
.win.s .ed-back{display:grid}
.win.s .s-kbd{display:none}
.win.h-sm{--tbh:40px}
.win.h-sm .ed-meta{display:none}
.win.h-sm .ed-title{font-size:22px}
.win.h-sm .nc-snip{-webkit-line-clamp:1}
.win.h-sm .ed-inner{padding:18px 24px 40px}
.win.h-sm .app-name{display:none}
.win.h-xs .ed-status{display:none}
.win.h-xs .lp-sub{display:none}
.win.h-xs .nc-meta{display:none}
.win.h-xs .sb-foot{display:none}
.win.no-snip .nc-snip{display:none}

/* ============ ACRYLIC FLYOUTS ============ */
.flyout{
  position:absolute;z-index:80;min-width:210px;max-width:280px;padding:4px;border-radius:8px;
  background:var(--acr);backdrop-filter:blur(30px) saturate(1.5);border:1px solid var(--acr-brd);
  box-shadow:0 18px 46px rgba(0,0,0,.32),0 2px 8px rgba(0,0,0,.18);
  opacity:0;transform:scale(.94);pointer-events:none;transform-origin:var(--fo,50% 0);
  transition:transform .16s cubic-bezier(.1,.9,.2,1),opacity .16s;
}
.flyout::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:var(--acr-noise);
  background:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='160' height='160'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='160' height='160' filter='url(%23n)' opacity='0.55'/%3E%3C/svg%3E")}
.flyout.open{opacity:1;transform:none;pointer-events:auto}
.fly-head{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--text3);padding:7px 10px 4px}
.fly-sep{height:1px;background:var(--divider);margin:4px 8px}
.fly-item{position:relative;display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:5px;font-size:12.5px;color:var(--text1);text-align:left;transition:background .12s}
.fly-item:hover{background:var(--nav-h)}
.fly-item:active{transform:scale(.98)}
.fly-item .ic svg{width:15px;height:15px;color:var(--text2)}
.fly-lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kbd{font-size:10px;font-family:ui-monospace,Consolas,monospace;color:var(--text3)}
.fly-chk{color:var(--accent)}
.fly-item.danger{color:var(--danger)}
.fly-item.danger .ic svg{color:var(--danger)}

/* toast */
.toast{position:absolute;left:50%;bottom:16px;transform:translate(-50%,14px);z-index:85;display:flex;align-items:center;gap:12px;padding:9px 16px;border-radius:8px;font-size:12.5px;color:var(--text1);background:var(--acr);backdrop-filter:blur(30px) saturate(1.5);border:1px solid var(--acr-brd);box-shadow:0 14px 40px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:transform .25s cubic-bezier(.15,.9,.25,1),opacity .25s}
.toast.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.t-act{color:var(--accent);font-weight:700;font-size:12.5px}
.t-act:empty{display:none}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;scroll-behavior:auto!important}
}
@media (prefers-reduced-transparency: reduce){
  .win{backdrop-filter:none;background:var(--mica-solid)}
  .flyout,.toast{backdrop-filter:none;background:var(--mica-solid)}
}
</style>
</head>
<body data-wall="light">

<div class="wall wall-l"></div>
<div class="wall wall-d"></div>
<div id="frame">
  <div class="half a" id="halfA"></div>
  <div class="divider"></div>
  <div class="half b" id="halfB"></div>

  <div class="flyout"></div>
  <div class="toast"><span class="t-msg"></span><button class="t-act"></button></div>`;
  host.appendChild(root);

  const q=s=>root.querySelector(s);
  const searchIn=q('.search'), burger=q('.burger'), themeBtn=q('.theme-btn'), splitBtn=q('.split-btn');
  const sidebar=q('.sidebar'), sbScroll=q('.sb-scroll'), nbsEl=q('.nbs'), tagsEl=q('.sb-tags');
  const lpTitle=q('.lp-title'), lpSub=q('.lp-sub'), lpScroll=q('.lp-scroll');
  const actFilter=q('.act-filter'), actSort=q('.act-sort'), newNoteBtns=[q('.new-note'),q('.sb-new')];
  const edBack=q('.ed-back'), tools=q('.ed-tools'), styleBtn=q('.style-btn'), styleLbl=q('.style-lbl');
  const pinBtn=q('.pin-btn'), edMore=q('.ed-more'), edScroll=q('.ed-scroll'), edInner=q('.ed-inner');
  const edTitle=q('.ed-title'), edBody=q('.ed-body'), edEmpty=q('.ed-empty');
  const metaNb=q('.meta-nb'), metaDate=q('.md-txt'), metaTags=q('.meta-tags'), mtTxt=q('.mt-txt');
  const wcEl=q('.wc'), saveEl=q('.save'), saveT=q('.save-t');
  const fly=q('.flyout'), toastEl=q('.toast'), tMsg=q('.t-msg'), tAct=q('.t-act');
  const scrim=q('.scrim');

  const st={notes:NOTES.map((n,i)=>({...n,tags:[...n.tags],ord:i})),ordMin:0,sel:'n1',nb:'all',tag:null,quick:'all',
            q:'',sort:'date',snippets:true,sbUser:false,overlay:false};
  const api={root,theme,host};
  APPS.push(api);

  /* theme + split */
  api.setTheme=t=>{
    api.theme=t;root.dataset.theme=t;

  /* ---------- renders ---------- */
  function filtered(){
    let arr=st.notes.filter(n=>{
      if(st.quick==='pinned'&&!n.pinned)return false;
      if(st.nb!=='all'&&n.nb!==st.nb)return false;

      if(st.q){const hay=(n.title+' '+strip(n.body)).toLowerCase();if(!hay.includes(st.q))return false}
      return true;
    });
    arr.sort((a,b)=>(b.pinned-a.pinned)||(st.sort==='title'?a.title.localeCompare(b.title):a.ord-b.ord));
    return arr;
  }
  function renderSidebar(){
    $$('.nav-item[data-q]',sidebar).forEach(b=>{
      const on=(b.dataset.q==='pinned')?(st.quick==='pinned'):(st.quick==='all'&&st.nb==='all'&&!st.tag);

  function renderList(){

    lpSub.textContent=`${arr.length} note${arr.length===1?'':'s'}`;

  function toast(msg,actLabel,fn){
    tMsg.textContent=msg; tAct.textContent=actLabel||''; toastFn=fn||null;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>toastEl.classList.remove('show'),3600);
  }
  tAct.addEventListener('click',()=>{if(toastFn)toastFn();toastEl.classList.remove('show')});

  /* ---------- flyout ---------- */
  let flyItems=[],flyAnchor=null;
  function buildFly(items){
    flyItems=items;
    fly.innerHTML=items.map((it,i)=>it.sep?'<div class="fly-sep"></div>':it.head?`<div class="fly-head">${it.head}</div>`:
      `<button class="fly-item rv ${it.danger?'danger':''}" data-i="${i}">${it.dot?`<span class="dot" style="background:${it.dot}"></span>`:it.icon?`<span class="ic">${it.icon}</span>`:''}<span class="fly-lbl">${it.label}</span>${it.kbd?`<span class="kbd">${it.kbd}</span>`:it.checked?`<span class="ic fly-chk">${IC.check}</span>`:''}</button>`).join('');
  }
  function placeFly(x,y,anchor){
    flyAnchor=anchor||null;
    const wr=root.getBoundingClientRect();
    fly.style.left='-9999px'; fly.style.top='-9999px'; fly.classList.add('open');
    const fw=fly.offsetWidth, fh=fly.offsetHeight;
    let ox='0%', oy='0';
    if(x+fw>wr.width-8){x=wr.width-8-fw;ox='100%'}
    if(x<8)x=8;
    if(y+fh>wr.height-8){y=y-fh-(anchor?anchor.offsetHeight+12:12);oy='100%'}
    if(y<8)y=8;
    fly.style.setProperty('--fo',`${ox} ${oy}`);
    fly.style.left=x+'px'; fly.style.top=y+'px';
  }
  function openFly(anchor,items){
    buildFly(items);
    const wr=root.getBoundingClientRect(), ar=anchor.getBoundingClientRect();
    placeFly(ar.left-wr.left, ar.bottom-wr.top+6, anchor);
  }
  function openFlyAt(cx,cy,items){buildFly(items);const wr=root.getBoundingClientRect();placeFly(cx-wr.left,cy-wr.top+4,null)}
  function closeFly(){fly.classList.remove('open');flyAnchor=null}
  fly.addEventListener('click',e=>{
    const b=e.target.closest('.fly-item'); if(!b)return;
    const it=flyItems[+b.dataset.i];
    if(it.keep){it.action&&it.action();buildFly(flyItems);return}
    closeFly(); it.action&&it.action();
  });
  root.addEventListener('pointerdown',e=>{
    if(fly.classList.contains('open')&&!fly.contains(e.target)&&!(flyAnchor&&flyAnchor.contains(e.target)))closeFly();
  },true);
  [lpScroll,edScroll,sbScroll].forEach(el=>el.addEventListener('scroll',closeFly,{passive:true}));

  /* ---------- flyout content ---------- */
  const sortItems=()=>[
    {head:'Sort by'},
    {label:'Last edited',icon:IC.clock,checked:st.sort==='date',action:()=>{st.sort='date';renderList()}},
    {label:'Title A–Z',icon:IC.sortIc,checked:st.sort==='title',action:()=>{st.sort='title';renderList()}},
    {sep:true},
    {label:'Show snippets',icon:IC.ul,checked:st.snippets,action:()=>{st.snippets=!st.snippets;root.classList.toggle('no-snip',!st.snippets)}},
    {sep:true},
    {label:'New note',icon:IC.plus,action:newNote}
  ];
  const filterItems=()=>[
    {head:'Filter by tag'},
    {label:'All tags',icon:IC.tag,checked:!st.tag,action:()=>{st.tag=null;renderSidebar();renderList()}},
    ...TAGS.map(t=>({label:t.name,dot:t.color,checked:st.tag===t.id,action:()=>{st.tag=st.tag===t.id?null:t.id;renderSidebar();renderList()}}))
  ];
  const styleItems=()=>{
    let cur='p'; try{cur=(document.queryCommandValue('formatBlock')||'p').toLowerCase()}catch(e){}
    return [['p','Paragraph'],['h2','Heading 1'],['h3','Heading 2'],['blockquote','Quote']].map(([b,l])=>({
      label:l,checked:cur===b,action:()=>{edBody.focus();try{document.execCommand('formatBlock',false,cur===b&&b!=='p'?'<p>':'<'+b+'>')}catch(e){} syncToolbar()}
    }));
  };
  const nbItems=n=>NBS.map(nb=>({label:nb.name,dot:nb.color,checked:n.nb===nb.id,action:()=>{n.nb=nb.id;renderSidebar();renderList();renderMeta()}}));
  const tagItems=n=>TAGS.map(t=>({label:t.name,dot:t.color,checked:n.tags.includes(t.id),keep:true,action:()=>{
    n.tags=n.tags.includes(t.id)?n.tags.filter(x=>x!==t.id):[...n.tags,t.id];renderList();renderMeta()}}));
  const noteItems=n=>[
    {label:n.pinned?'Unpin note':'Pin note',icon:IC.pin,action:()=>{n.pinned=!n.pinned;renderList();renderMeta()}},
    {label:'Duplicate',icon:IC.copy,action:()=>{const c={...n,id:'n'+Math.random().toString(36).slice(2,7),title:n.title+' (copy)',tags:[...n.tags],ord:n.ord-.5,date:'Just now'};st.notes.push(c);selectNote(c.id);renderSidebar();toast('Note duplicated')}},
    {label:'Copy link',icon:IC.link,kbd:'Ctrl C',action:()=>toast('Link copied to clipboard (demo)')},
    {sep:true},
    {label:'Delete note',icon:IC.trash,danger:true,action:()=>deleteNote(n)}
  ];
  function deleteNote(n){
    const idx=st.notes.indexOf(n); st.notes.splice(idx,1);
    const next=filtered()[0]; st.sel=next?next.id:null;
    renderSidebar();renderList();renderEditor();
    toast('Note deleted','Undo',()=>{st.notes.splice(idx,0,n);renderSidebar();renderList();if(st.sel===null)selectNote(n.id)});
  }
  function newNote(){
    const n={id:'n'+Math.random().toString(36).slice(2,7),title:'',body:'',nb:st.nb!=='all'?st.nb:'design',tags:st.tag?[st.tag]:[],pinned:false,date:'Just now',ord:--st.ordMin};
    st.notes.unshift(n); st.quick='all';
    renderSidebar(); selectNote(n.id); edTitle.focus();
  }

  /* ---------- sidebar events ---------- */
  sidebar.addEventListener('click',e=>{
    const qb=e.target.closest('[data-q]'), nb=e.target.closest('[data-nb]'), tg=e.target.closest('[data-tag]');
    if(e.target.closest('.sb-set')){toast('Settings is a demo surface');return}
    if(e.target.closest('.sb-new')){newNote();closeOverlayIf();return}
    if(qb){st.quick=qb.dataset.q;st.nb='all';st.tag=null}
    else if(nb){st.nb=nb.dataset.nb;st.quick='all';st.tag=null}
    else if(tg){st.tag=st.tag===tg.dataset.tag?null:tg.dataset.tag;st.quick='all'}
    else return;
    renderSidebar();renderList();closeOverlayIf();
  });
  function closeOverlayIf(){if(st.overlay){st.overlay=false;root.classList.remove('sb-open')}}

  /* ---------- list events ---------- */
  lpScroll.addEventListener('click',e=>{
    if(e.target.closest('[data-clear]')){st.q='';st.tag=null;searchIn.value='';renderSidebar();renderList();return}
    const c=e.target.closest('.note-card'); if(c)selectNote(c.dataset.id);
  });
  lpScroll.addEventListener('contextmenu',e=>{
    const c=e.target.closest('.note-card'); if(!c)return;
    e.preventDefault();
    const n=st.notes.find(x=>x.id===c.dataset.id);
    openFlyAt(e.clientX,e.clientY,noteItems(n));
  });
  actSort.addEventListener('click',()=>openFly(actSort,sortItems()));
  actFilter.addEventListener('click',()=>openFly(actFilter,filterItems()));
  newNoteBtns[1].addEventListener('click',newNote);

  /* ---------- editor events ---------- */
  edBack.addEventListener('click',()=>root.classList.remove('show-editor'));
  tools.addEventListener('mousedown',e=>{if(e.target.closest('button'))e.preventDefault()});
  tools.addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b)return;
    const n=st.notes.find(x=>x.id===st.sel); if(!n)return;
    if(b===styleBtn){openFly(styleBtn,styleItems());return}
    if(b===edMore){openFly(edMore,noteItems(n));return}
    if(b===pinBtn){n.pinned=!n.pinned;renderList();renderMeta();return}
    const cmd=b.dataset.cmd; if(!cmd)return;
    edBody.focus();
    try{
      if(cmd==='quote'){let cur='p';try{cur=(document.queryCommandValue('formatBlock')||'').toLowerCase()}catch(e2){}
        document.execCommand('formatBlock',false,cur==='blockquote'?'<p>':'<blockquote>');}
      else if(cmd==='hiliteColor'){document.execCommand('styleWithCSS',false,true);document.execCommand('hiliteColor',false,api.theme==='dark'?'rgba(255,210,63,.32)':'#ffe9a0')}
      else if(cmd==='link'){const u=prompt('Link URL','https://');if(u)document.execCommand('createLink',false,u)}
      else document.execCommand(cmd,false,null);
    }catch(err){}
    syncToolbar(); markSaving();
  });
  metaNb.addEventListener('click',()=>{const n=st.notes.find(x=>x.id===st.sel);if(n)openFly(metaNb,nbItems(n))});
  metaTags.addEventListener('click',()=>{const n=st.notes.find(x=>x.id===st.sel);if(n)openFly(metaTags,tagItems(n))});
  edTitle.addEventListener('input',()=>{const n=st.notes.find(x=>x.id===st.sel);if(n){n.title=edTitle.textContent;renderList();markSaving()}});
  edTitle.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();edBody.focus()}});
  edBody.addEventListener('input',()=>{const n=st.notes.find(x=>x.id===st.sel);if(n){n.body=edBody.innerHTML;renderList();updateStatus();markSaving()}});

  function syncToolbar(){
    if(document.activeElement!==edBody&&document.activeElement!==edTitle)return;
    $$('button[data-cmd]',tools).forEach(b=>{
      const c=b.dataset.cmd;
      if(['bold','italic','underline','strikeThrough','insertUnorderedList','insertOrderedList'].includes(c)){
        let on=false;try{on=document.queryCommandState(c)}catch(e){}
        b.classList.toggle('toggled',on);
      }
    });
    let cur='p';try{cur=(document.queryCommandValue('formatBlock')||'p').toLowerCase()}catch(e){}
    styleLbl.textContent={p:'Paragraph',h2:'Heading 1',h3:'Heading 2',blockquote:'Quote',div:'Paragraph'}[cur]||'Paragraph';
  }
  api.sync=syncToolbar;

  /* ---------- search ---------- */
  searchIn.addEventListener('input',()=>{st.q=searchIn.value.trim().toLowerCase();renderList()});

  /* ---------- burger / overlay ---------- */
  burger.addEventListener('click',()=>{
    if(root.classList.contains('m')||root.classList.contains('s')){
      st.overlay=!st.overlay; root.classList.toggle('sb-open',st.overlay);
    }else{
      st.sbUser=!st.sbUser; root.classList.toggle('sb-user',st.sbUser);
    }
  });
  scrim.addEventListener('click',closeOverlayIf);

  /* ---------- reveal hover ---------- */
  root.addEventListener('pointermove',e=>{
    if(e.pointerType!=='mouse')return;
    const t=e.target.closest('.rv'); if(!t)return;
    const r=t.getBoundingClientRect();
    t.style.setProperty('--mx',(e.clientX-r.left)+'px');
    t.style.setProperty('--my',(e.clientY-r.top)+'px');
  });

  /* ---------- container breakpoints ---------- */
  new ResizeObserver(()=>{
    const w=root.clientWidth,h=root.clientHeight;
    root.classList.toggle('xl',w>=1000);
    root.classList.toggle('l',w>=780&&w<1000);
    root.classList.toggle('m',w>=620&&w<780);
    root.classList.toggle('s',w<620);
    root.classList.toggle('h-sm',h<600&&h>=430);
    root.classList.toggle('h-xs',h<430);
    if(!(w<620))root.classList.remove('show-editor');
  }).observe(root);

  api.setTheme(theme);
  renderAll();
  return api;
}

/* ================= BOOT ================= */
const appA=createApp($('#halfA'),'light');
const appB=createApp($('#halfB'),'dark');
appA.onTheme=t=>{document.body.dataset.wall=t};
document.addEventListener('selectionchange',()=>requestAnimationFrame(()=>APPS.forEach(a=>a.sync&&a.sync())));
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){APPS.forEach(a=>{a.root.querySelector('.flyout').classList.remove('open');a.root.classList.remove('sb-open')})}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();appA.root.querySelector('.search').focus()}
});
try{document.execCommand('styleWithCSS',false,true)}catch(e){}
</script>
</body>
</html>
